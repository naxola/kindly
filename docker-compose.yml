# Local development and tests. Staging (homelab) gets its own compose in phase 6.
name: saas-template

services:
  postgres:
    image: postgres:18.6-trixie
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      APP_MIGRATOR_PASSWORD: ${APP_MIGRATOR_PASSWORD:-migrator}
      APP_USER_PASSWORD: ${APP_USER_PASSWORD:-app}
      APP_PLATFORM_PASSWORD: ${APP_PLATFORM_PASSWORD:-platform}
      APP_DATABASES: saas saas_test saas_shadow
    ports:
      - '${POSTGRES_PORT:-5441}:5432'
    volumes:
      - pgdata:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d saas']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
