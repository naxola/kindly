# Mandatory checks on every pull request and on the integration branches.
name: CI

on:
  pull_request:
  push:
    branches: [main, staging]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Format, lint, types, unit, build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Enable pnpm
        run: corepack enable
      - name: pnpm store path
        id: pnpm
        run: echo "store=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ steps.pnpm.outputs.store }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: cp .env.example .env
      - run: pnpm db:generate
      - name: OpenAPI contract is up to date
        run: |
          pnpm api:generate
          git diff --exit-code -- docs/api/openapi.json || (echo "::error::docs/api/openapi.json is outdated: run 'pnpm api:generate' and commit it" && exit 1)
      - run: pnpm format:check
      # Typed lint of the whole monorepo exceeds Node's default heap on the runner.
      - run: pnpm lint
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  integration:
    name: Integration (Postgres) and migrations
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Enable pnpm
        run: corepack enable
      - name: pnpm store path
        id: pnpm
        run: echo "store=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ steps.pnpm.outputs.store }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: cp .env.example .env
      - name: Start Postgres
        run: pnpm infra:up
      - run: pnpm db:generate
      - name: Migrations apply cleanly from zero (dev database)
        run: pnpm db:deploy
      - name: Schema and migrations are in sync
        run: pnpm db:check
      - run: pnpm test:integration
      - name: Generate the typed API client (needed by the web build)
        run: pnpm api:generate
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: E2E (Playwright, production build against the test database)
        run: pnpm test:e2e
      - name: Infra logs on failure
        if: failure()
        run: docker compose logs --tail 200

  security:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - run: corepack enable
      - name: Audit production dependencies (high and critical)
        run: pnpm audit --prod --audit-level high
