# Accepted findings of the image scan (CI, R5.2). Every entry needs a reason and an expiry date:
# when it expires the scan fails again and the exception is reviewed. Decided by the user; never
# add one just to get the CI green.
vulnerabilities:
  - id: CVE-2025-68121
    # Only for this binary: the same CVE anywhere else still fails the scan.
    paths:
      - usr/local/bin/gosu
    statement: >-
      Go stdlib crypto/tls bug in the `gosu` binary (built with Go 1.24.6) shipped by the official
      postgres:18.6-trixie image. gosu only drops privileges when the container starts and opens
      no TLS connection, so the affected code does not run. Fixed upstream when the base image
      rebuilds gosu; postgres 18.7-trixie (2026-11-12) is not yet 14 days old (ADR 0009).
      Accepted by the user on 2026-11-14.
    expired_at: 2026-12-14
