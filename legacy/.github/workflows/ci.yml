name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: kindly
          POSTGRES_PASSWORD: kindly
          POSTGRES_DB: kindly
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kindly -d kindly"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://kindly:kindly@localhost:5432/kindly
      TEST_DATABASE_URL: postgresql://kindly:kindly@localhost:5432/kindly_test
      # CI-only value. Never reuse a real secret here (CLAUDE.md sección 5).
      BETTER_AUTH_SECRET: ci-only-secret-not-for-production-use
      BETTER_AUTH_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Create test database
        run: PGPASSWORD=kindly psql -h localhost -U kindly -d kindly -c "CREATE DATABASE kindly_test;"

      - run: npm run lint
      - run: npm run typecheck

      - name: Apply migrations to the dev database (needed for build/e2e)
        run: npm run db:migrate

      - name: Unit + integration tests
        run: npm test

      - run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e
